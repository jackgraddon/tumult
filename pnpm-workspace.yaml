packages:
  - 'packages/*'
  - 'apps/*'
  # The plugin template is a workspace member so its example is typechecked
  # against the real API (templates/plugin/tsconfig.workspace.json) with the
  # same vue/typescript the app resolves. It publishes to a standalone repo.
  - 'templates/*'

# esbuild is Vite's bundler; its postinstall fetches the platform binary, so
# without this the dev server and build can't run.
allowBuilds:
  esbuild: true
  vue-demi: true

# Security floor for transitive dependencies. source-map-js <1.2.2 has an
# event-loop DoS (GHSA-68fv-2mgg-jv7q); it arrives through Vue's SFC compiler,
# which has not bumped it yet. Drop the entry once nothing resolves below it.
overrides:
  source-map-js: ">=1.2.2"
  # minimatch <11.0.1: ReDoS via globparts amplification (GHSA-g3hv-75wg-m249),
  # no 10.x fix. The 10.x line (ESLint, on our own config's patterns) takes 11,
  # whose API it uses unchanged. Scoped to 10.x on purpose: standard-version's
  # dotgitignore needs 3.x's `minimatch.makeRe`, which 11 removed — an unscoped
  # override broke `pnpm release` ("minimatch.makeRe is not a function").
  minimatch@10: ">=11.0.1"

patchedDependencies:
  matrix-js-sdk@45.0.0: patches/matrix-js-sdk@45.0.0.patch
