name: Tumult CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # pnpm/action-setup reads `packageManager` (pnpm@11.13.1) from package.json so
    # CI uses the exact pinned pnpm — no drift between CI and local (which the old
    # `cache: 'pnpm'` approach did not guarantee).
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'   # package.json engines: node >=22

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Type Check
      run: pnpm -r typecheck

    - name: Unit Tests
      # Hermetic per-package `test/` suites (core, ui, theme). The Docker-backed
      # integration suites (test-integration/, run via `pnpm test:integration`)
      # are intentionally NOT in the default CI.
      run: pnpm -r test

    - name: Install Firefox for the browser smoke test
      # The smoke test runs a `--mode fake` build: no homeserver, no network
      # (see apps/web/test/browser.test.ts docstring), so it is safe in CI.
      # `playwright` is a devDependency of @tumult/web, not of the root, so it
      # must be run through the filter — a root-level `pnpm exec playwright`
      # fails with "Command not found".
      run: pnpm --filter @tumult/web exec playwright install --with-deps firefox

    - name: Browser Smoke Test
      run: pnpm --filter @tumult/web test:browser

    - name: Build
      # A successful end-to-end build for every push; release.yml trusts this
      # gate and lets Vercel build the tag itself.
      run: pnpm -r build

    # The Docker/Synapse integration suite (tests/synapse/run.sh, via
    # `pnpm test:integration`) and the live-homeserver test
    # (`pnpm --filter @tumult/web test:live`) need Docker / a real server and
    # stay LOCAL tasks. They are kept out of default CI so `main` can stay
    # green without a Docker-in-Docker runner.
