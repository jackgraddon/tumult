name: Desktop builds

# Builds the Electron desktop app (apps/desktop) for Linux (AppImage, deb, rpm)
# and Windows (NSIS x64). On a v* tag the packages are attached as RAW release
# assets to the release `pnpm release` cut for that tag (scripts/release.ts), so
# they download uncompressed rather than as a zipped workflow artifact on the
# Linux/Windows jobs. A branch push or a manual run has no tag, so there it falls
# back to a zipped artifact (that is the only thing there to be). No update feed
# is published: a draft the desktop CI never flips live — a maintainer does, once
# the packages are attached — and auto-update is a deliberate non-goal (see the
# README's deferred list).
#
# Build-time env: the desktop bundles a REAL-client web build, which needs
# VITE_CLIENT_URI (apps/web/vite.config.ts fails the build without it). It is
# a public URL identifying the application to the IdP — not a secret — so it
# comes from a repository VARIABLE (Settings → Secrets and variables → Actions →
# Variables), set once:
#   gh variable set VITE_CLIENT_URI --body https://tumult.example.org
# Optional, same mechanism: VITE_ELEMENT_CALL_URL, VITE_VOICE.
# (release.yml gets the web deploy's env from `vercel pull` instead; the desktop
# has no Vercel project, and needs no Vercel token to build.)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    # Any branch that touches the desktop app (or this workflow) gets
    # packages too — also how a branch runs this before it is on main, since
    # workflow_dispatch only works once the file exists on the default branch.
    # (Path filters are ignored for tag pushes, so every v* tag still builds.)
    branches:
      - '**'
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'

# `contents: write` so a tag run can create/attach the GitHub release's assets
# (branch and manual runs only read the checked-out repo, so no other write is
# exercised here).
permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
            artifact: tumult-desktop-linux
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
          - os: windows-latest
            dist: dist:win
            artifact: tumult-desktop-windows
            files: |
              apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      VITE_CLIENT_URI: ${{ vars.VITE_CLIENT_URI }}
      VITE_ELEMENT_CALL_URL: ${{ vars.VITE_ELEMENT_CALL_URL }}
      VITE_VOICE: ${{ vars.VITE_VOICE }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Require VITE_CLIENT_URI
      run: |
        if [ -z "$VITE_CLIENT_URI" ]; then
          echo "::error::Set the repository variable VITE_CLIENT_URI (see the comment at the top of desktop.yml)."
          exit 1
        fi

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Linux packaging and sandbox prerequisites
      if: runner.os == 'Linux'
      run: |
        # rpmbuild for the rpm target; xvfb for a headless display.
        sudo apt-get update
        sudo apt-get install -y rpm xvfb
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which Chromium's sandbox needs; node_modules' chrome-sandbox is not
        # setuid either. The app keeps its sandbox ON — the runner is opened up
        # instead. (Installed packages: deb/rpm make chrome-sandbox setuid.)
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Unit tests (desktop)
      run: pnpm --filter @tumult/desktop test

    - name: Desktop smoke test (Linux, under xvfb)
      if: runner.os == 'Linux'
      # pretest:smoke builds core, theme, the FAKE desktop web build and the
      # main process; no homeserver or network is needed.
      run: |
        pnpm --filter @tumult/desktop run pretest:smoke
        xvfb-run -a pnpm --filter @tumult/desktop exec node --test --import tsx smoke/desktop.smoke.ts

    - name: Desktop smoke test (Windows)
      if: runner.os == 'Windows'
      run: pnpm --filter @tumult/desktop test:smoke

    - name: Package
      # dist:* rebuild core/theme, the REAL desktop web build and the main
      # process, then run electron-builder with --publish never.
      run: pnpm --filter @tumult/desktop ${{ matrix.dist }}

    - name: Upload packages as artifacts
      # A branch push or a manual run has no release, so this is what the packages
      # become. A zipped bundle is fine here: it downloads one file.
      if: github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.files }}
        if-no-files-found: error

    - name: Attach packages to the release
      # A v* tag is the one case that matters: a user downloads the package, so it
      # must be a raw, uncompressed release asset, not a zipped artifact. `pnpm
      # release` already cut a DRAFT for the tag (with the CHANGELOG notes), which
      # the desktop CI never publishes — a maintainer flips it live once the
      # packages are attached.
      #
      # `gh release upload` creates the release for the tag if it does not exist
      # (a tag cut some other way), which would otherwise be PUBLISHED — so we
      # create a DRAFT first when missing. The two matrix arms (Linux + Windows)
      # can race to that create, so it is best-effort: the upload below is the
      # real gate and fails the run if the release is truly unreachable.
      if: github.ref_type == 'tag'
      run: |
        set -euo pipefail
        tag=${{ github.ref_name }}
        if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
          echo "::notice::release $tag not found; creating a draft for the packages"
          gh release create "$tag" --draft || true
        fi
        # matrix.files is a multi-line glob list; left unquoted, bash expands each
        # into the files present and hands them to `gh release upload`, which
        # uploads the raw bytes. `--clobber` makes a re-run idempotent.
        gh release upload --clobber "$tag" ${{ matrix.files }}
