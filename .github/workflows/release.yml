name: Publish Release to Vercel

on:
  push:
    tags:
      # Fires whenever a version tag (e.g. v0.1.1) is pushed to the repo.
      - 'v*'
  # Manual dry-run: `pnpm release` tags are not re-runnable, so a maintainer can
  # validate the whole pipeline against any ref (e.g. main) without cutting a
  # new release.
  workflow_dispatch:

# Scoping a workflow's `permissions` block defaults every other permission to
# `none`, so grant back what we use explicitly. `contents: read` is required for
# checkout on a private repo — on a tag push a checkout without it 404s
# ("remote: Repository not found").
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # VERCEL_ORG_ID + VERCEL_PROJECT_ID set together let the CLI target the
    # project without `vercel link` / a `.vercel/` directory. VERCEL_TOKEN as an
    # env var is read natively by the CLI — never pass it as `--token` (argv is
    # visible in process listings).
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    # Everything runs from the REPO ROOT, because the Vercel project's Root
    # Directory is already `apps/web` (set in the dashboard). The CLI prefixes
    # that root itself, so running a step inside `apps/web` composes the two into
    # `apps/web/apps/web` — which `vercel build` tolerates with a warning but
    # `vercel deploy` rejects outright ("The provided path … does not exist").
    # One of the two has to be the single source of the prefix, and the project
    # setting is the canonical one.
    #
    # The consequence to know about: `vercel pull` writes
    # `.vercel/.env.production.local` RELATIVE TO THE WORKING DIRECTORY, so it
    # lands at the repo root. Vite resolves env relative to `envDir`, which
    # `apps/web/vite.config.ts` points at the repo root for exactly this reason —
    # if it did not, the app would build without `VITE_CLIENT_URI`,
    # `chat.real.ts` would throw at module scope, and the site would serve a
    # blank page while every gate stayed green.
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    # pnpm/action-setup reads `packageManager` (pnpm@11.13.1) from package.json
    # so CI uses the exact pinned pnpm — same as ci.yml.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'   # package.json engines: node >=22
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    # Vercel's official GitHub Actions pattern (vercel.com/kb/guide/
    # how-can-i-use-github-actions-with-vercel): pull → build → deploy
    # --prebuilt. The build runs HERE (that's why pnpm is set up above) and only
    # .vercel/output is uploaded, so Vercel never rebuilds the same artifact.
    # `vercel pull` fetches build-time env (e.g. VITE_CLIENT_URI) from the Vercel
    # project's environment — nothing is plumbed through CI secrets. CI on main
    # remains the pre-merge gate (see .github/workflows/ci.yml).
    - name: Install Vercel CLI
      # Pinned to the current major (64.x); the old amondnet/vercel-action
      # bundled CLI v50 and is a single-maintainer action — the breakage source
      # this workflow replaces.
      run: npm install --global vercel@64

    - name: Pull Vercel environment
      # Writes `.vercel/.env.production.local` at the repo root (the working
      # directory); `apps/web/vite.config.ts` sets `envDir` there so Vite reads
      # it. See the job comment above.
      run: vercel pull --yes --environment=production

    - name: Build project artifacts
      run: vercel build --prod

    - name: Deploy project artifacts to Vercel (production)
      # No --no-wait: the CLI polls until the deployment is ready and exits
      # non-zero on failure, so a broken deploy fails the job visibly.
      run: vercel deploy --prebuilt --prod
