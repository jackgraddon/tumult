name: Publish Release to Vercel

on:
  push:
    tags:
      # Triggers this workflow whenever a git tag (e.g., v1.0.0) is pushed
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Production Artifacts
      # Re-run the build to ensure the artifact tied to this tag is available
      run: pnpm build

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25.0.0 # Recommended Vercel Action
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }} 
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod' # Ensures the deployment is a production release
