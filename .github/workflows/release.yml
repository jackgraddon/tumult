name: Publish Release to Vercel

on:
  push:
    tags:
      # Fires whenever a version tag (e.g. v0.1.1) is pushed to the repo.
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Scoping a job's `permissions` block defaults every *other* permission to
      # `none`, and on a private repo that silently revokes the `contents: read`
      # a branch checkout gets for free. Without it the checkout 404s ("remote:
      # Repository not found") — which is why the tag deploy failed while main's
      # *unscoped* checkout succeeded. Grant it back explicitly.
      contents: read
      # GitHub Environments "deployment" tracking (github-deployment: true).
      deployments: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    # CLI mode with `--prod` and NO prebuilt artifact: Vercel builds from source
    # at deploy time, so build-time env (e.g. VITE_CLIENT_URI) comes from the
    # Vercel project's environment — nothing is plumbed through CI. CI on `main`
    # already validated the build (see .github/workflows/ci.yml).
    - name: Deploy to Vercel (production)
      uses: amondnet/vercel-action@v42
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: --prod
        github-deployment: true
