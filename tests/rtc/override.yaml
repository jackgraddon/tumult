# Layered over the generated homeserver.yaml. Checked in; data/ is not.
enable_registration: true
enable_registration_without_verification: true
report_stats: false
url_preview_enabled: false
# No federation_domain_whitelist: an empty one switches federation OFF, and
# lk-jwt-service verifies every OpenID token over the federation API.
public_baseurl: http://127.0.0.1:8018/
# Replaces the generated listener list (host networking, so ports are real).
# Loopback only: open registration must not face a LAN.
listeners:
  # Client API (and plain federation) for the test runner and the browsers.
  - port: 8018
    bind_addresses: ["127.0.0.1"]
    type: http
    tls: false
    x_forwarded: false
    resources:
      - names: [client, federation]
        compress: false
  # Federation over TLS: where lk-jwt-service resolves server name `localhost`
  # (no .well-known, no SRV → port 8448). Self-signed; the service is told to
  # skip verification.
  - port: 8448
    bind_addresses: ["127.0.0.1"]
    type: http
    tls: true
    resources:
      - names: [federation]
        compress: false
tls_certificate_path: /tls/tls.crt
tls_private_key_path: /tls/tls.key
rc_registration: { per_second: 1000, burst_count: 1000 }
rc_login:
  address: { per_second: 1000, burst_count: 1000 }
  account: { per_second: 1000, burst_count: 1000 }
  failed_attempts: { per_second: 1000, burst_count: 1000 }
rc_message: { per_second: 1000, burst_count: 1000 }
# Delayed events are how a crashed client leaves a call.
max_event_delay_duration: 24h
rc_delayed_event_mgmt: { per_second: 1000, burst_count: 1000 }
experimental_features:
  msc3266_enabled: true
  msc4143_enabled: true
  msc4222_enabled: true
  msc4140_enabled: true
  msc4354_enabled: true
matrix_rtc:
  transports:
    - type: livekit
      livekit_service_url: http://127.0.0.1:8090
