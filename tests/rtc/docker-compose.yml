# Throwaway MatrixRTC stack: a Synapse new enough to speak MSC4143/4140/4354, a
# LiveKit SFU, and the MSC4195 authorization service. Separate from
# tests/synapse because that baseline is pinned to v1.114.0 on purpose (the
# MSC4186 floor in AGENTS.md) and cannot serve /rtc/transports.
#
# UNVERIFIED: written without a Docker daemon to hand. Image tags and the
# lk-jwt-service variables follow element-call's docs/self_hosting.md; expect to
# tune them on first run.
services:
  synapse:
    # Images are fully qualified: Podman refuses short names without a TTY.
    image: docker.io/matrixdotorg/synapse:v1.163.0
    ports:
      - "8018:8008"
    volumes:
      # `z` relabels for SELinux (Fedora); a no-op on hosts without it.
      - ./data:/data:z
      # Mounted, not copied into data/ (see tests/synapse/docker-compose.yml).
      - ./override.yaml:/conf/override.yaml:ro,z
    command: ["run", "-c", "/data/homeserver.yaml", "-c", "/conf/override.yaml"]

  livekit:
    image: docker.io/livekit/livekit-server:v1.9.0
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro,z

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    ports:
      - "8090:8080"
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: devsecret-devsecret-devsecret-0123
      LIVEKIT_JWT_PORT: "8080"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # The test homeserver has no TLS; the service verifies OpenID tokens over
      # federation, so it must be allowed to skip verification here. Test only.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_IM_DOING
