# Throwaway MatrixRTC stack: a Synapse new enough to speak MSC4143/4140/4354, a
# LiveKit SFU, and the MSC4195 authorization service. Separate from
# tests/synapse because that baseline is pinned to v1.114.0 on purpose (the
# MSC4186 floor in AGENTS.md) and cannot serve /rtc/transports.
#
# HOST networking, for three reasons that each break a bridged stack:
#  - lk-jwt-service verifies a browser's OpenID token by calling the homeserver
#    over federation, as server name `localhost` → https://localhost:8448. In a
#    bridged container, `localhost` is the service itself.
#  - The SFU url it hands out (LIVEKIT_URL) must be reachable both by the
#    service (room creation) and by the browser; on the host it is one address.
#  - WebRTC media is UDP across a port range; mapping that range through a
#    bridge is slow to start and fragile. On the host it needs nothing.
# Host networking is Linux (CI, Fedora + Podman). Docker Desktop on macOS needs
# its host-networking setting turned on. Everything binds 127.0.0.1 only: the
# stack has open registration and dev keys, and must not face a LAN.
#
# Images are fully qualified (Podman refuses short names without a TTY) and
# pinned; bump deliberately.
services:
  synapse:
    image: docker.io/matrixdotorg/synapse:v1.163.0
    network_mode: host
    volumes:
      # `z` relabels for SELinux (Fedora); a no-op on hosts without it.
      - ./data:/data:z
      # Mounted, not copied into data/ (see tests/synapse/docker-compose.yml).
      - ./override.yaml:/conf/override.yaml:ro,z
      # Self-signed, generated by run.sh: the federation listener needs TLS.
      - ./tls:/tls:ro,z
    command: ["run", "-c", "/data/homeserver.yaml", "-c", "/conf/override.yaml"]

  livekit:
    image: docker.io/livekit/livekit-server:v1.13.11
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro,z

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.9.0
    network_mode: host
    environment:
      # Handed to browsers as the SFU address, and used by the service itself.
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: devsecret-devsecret-devsecret-0123
      LIVEKIT_JWT_BIND: 127.0.0.1:8090
      LIVEKIT_FULL_ACCESS_HOMESERVERS: localhost
      # OpenID tokens are verified over federation against Synapse's
      # self-signed TLS listener. Test only. The value must be exactly this
      # string (src/config.rs); anything else silently keeps verification on.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
      # The C-S API for `localhost` cannot be found by .well-known discovery.
      LIVEKIT_CS_API_URL_OVERRIDES: localhost=http://127.0.0.1:8018
      LIVEKIT_LOG_LEVEL: debug
